# Functional single-slice bring-up. All arch fields are consumed by upstream target.py.
[target]
name = "v80_smoke"
kind = "fpga"
platform_id = 1446522881 # 0x56383001, local V80 platform identifier
description = "V80 M3 platform, single openTPU slice, non-pumped TMEM, polling"

[arch]
S = 1
D = 128
MCOLS = 4
ACT_BLOCKS = 16
ACT_ROWS = 4
TMEM_WORDS = 16384
IMEM_WORDS = 8192 # 32-bit words; 1024 instructions
DRAM_BYTES = 4294967296
LANES = 8
PAIR = false
DSTEP = false
STREAM = false
SEQ_WC = false

[uarch]
MXU_IMPL = 2
MXU_CL = 16
MXU_E = 4
VPU_CL = 2
ULANES = 8
TMEM_IMPL = 0
TMEM_PMP = 0
RPB = 0
WPB = 1
WIN = 16
FIFO_DEPTH = 128
TRACE_DEPTH = 0
PQ_WIN = 1024
CHASH = false

[tech]
family = "generic"
part = "xcv80-lsva4737-2MHP-e-S"
vendor = "xilinx"

[platform]
board = "v80_smoke"
core_mhz = 75.0
mem = "hbm"
channels_per_slice = 4
channel_bytes = 1073741824
beat_bytes = 64
host = "qdma"

[v80]
control_mhz = 100
memory_axi_mhz = 400
axi_data_bits = 1024
bar2_control_offset = 65536
hbm_physical_base = 274877906944 # 0x4000000000
board_part = "xilinx.com:v80:part0:2.0"
